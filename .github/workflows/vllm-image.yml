# The slim vLLM image (Dockerfile.vllm) that docker-compose.yml pulls: ghcr.io/<owner>/egypt-law-rag-vllm:<vllm version>.
#
# It changes only with the vLLM environment, so it builds only when Dockerfile.vllm or requirements-serve.lock
# changes (or on demand), not on every push like the API image. Pull requests build it without pushing.
name: vLLM image

on:
  pull_request:
    paths: [Dockerfile.vllm, requirements-serve.lock, .github/workflows/vllm-image.yml]
  push:
    branches: [main]
    paths: [Dockerfile.vllm, requirements-serve.lock, .github/workflows/vllm-image.yml]
  workflow_dispatch:

concurrency:
  group: vllm-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (the image installs ~8 GB of wheels)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Tags
        id: tags
        run: |
          image="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/egypt-law-rag-vllm"
          version="$(sed -n 's/^vllm==//p' requirements-serve.lock)"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build
        run: >-
          docker build -f Dockerfile.vllm
          -t ${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.version }}
          -t ${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.sha }}
          --label org.opencontainers.image.source=https://github.com/${{ github.repository }}
          --label org.opencontainers.image.revision=${{ github.sha }}
          .
      - name: Smoke test (imports only, no GPU on this runner)
        run: |
          docker run --rm --entrypoint python ${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.version }} \
            -c "import torch, vllm; print('vllm', vllm.__version__, 'torch', torch.__version__, 'cuda', torch.version.cuda)"
          docker images ${{ steps.tags.outputs.image }}
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.event_name != 'pull_request'
        run: docker push --all-tags ${{ steps.tags.outputs.image }}
