# Canary rollout: two versions of the API behind nginx, traffic split by weight (README, "Canary rollout").
#
#   STABLE_IMAGE=ghcr.io/devahmedhesham-ml/egypt-law-rag-api:<old sha> \
#   CANARY_IMAGE=ghcr.io/devahmedhesham-ml/egypt-law-rag-api:<new sha> \
#   docker compose -f deploy/canary/docker-compose.yml up -d
#   deploy/canary/set_weights.sh 90 10      # start: 10% of traffic on the canary
#   deploy/canary/set_weights.sh 50 50      # widen if healthy
#   deploy/canary/set_weights.sh 0 100      # promote (or 100 0 to roll back)
#
# Both versions answer with the same LLM (vLLM on the host, :8001, by default) and report their version in the
# X-Release header; nginx logs it for every request.
services:
  api-stable:
    image: ${STABLE_IMAGE:-egypt-law-rag-api:latest}
    env_file:
      - path: ../../.env
        required: false
    environment:
      APP_RELEASE: ${STABLE_RELEASE:-stable}
      LLM_BACKEND: ${LLM_BACKEND:-vllm}
      VLLM_BASE_URL: ${API_VLLM_URL:-http://host.docker.internal:8001/v1}
      LANGFUSE_TRACING_ENVIRONMENT: canary
    extra_hosts:
      - "host.docker.internal:host-gateway"

  api-canary:
    image: ${CANARY_IMAGE:-egypt-law-rag-api:latest}
    env_file:
      - path: ../../.env
        required: false
    environment:
      APP_RELEASE: ${CANARY_RELEASE:-canary}
      LLM_BACKEND: ${LLM_BACKEND:-vllm}
      VLLM_BASE_URL: ${API_VLLM_URL:-http://host.docker.internal:8001/v1}
      LANGFUSE_TRACING_ENVIRONMENT: canary
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-stable
      - api-canary
