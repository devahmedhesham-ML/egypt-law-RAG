apiVersion: 1

contactPoints:
  - orgId: 1
    name: alert-log
    receivers:
      - uid: alert-log-webhook
        type: webhook
        settings:
          url: http://alert-receiver:8080/alert
          httpMethod: POST

policies:
  - orgId: 1
    receiver: alert-log
    group_by: ["alertname", "label"]
    group_wait: 5s
    group_interval: 30s
    repeat_interval: 4h

groups:
  - orgId: 1
    name: ragas
    folder: Egypt Law RAG
    interval: 30s
    rules:
      - uid: ragas-faithfulness-low
        title: RAGAS faithfulness below 0.80
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              expr: rag_ragas_faithfulness
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: lt, params: [0.8]}
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "RAGAS faithfulness {{ printf \"%.3f\" $values.B.Value }} is below the 0.80 threshold"
