llm:
  backend: vllm            # vllm (main: Qwen2.5-7B-Instruct, self-hosted) | bedrock (optional extra)
  temperature: 0.0         # deterministic, so backends and runs are comparable
  max_tokens: 1024
  bedrock:                 # optional: Bedrock's OpenAI-compatible endpoint, key: Bedrock_API_key in .env
    model: openai.gpt-oss-120b
    base_url: https://bedrock-mantle.eu-north-1.api.aws/v1   # overridden by OPENAI_BASE_URL
  vllm:
    model: Qwen/Qwen2.5-7B-Instruct-AWQ
    base_url: http://localhost:8001/v1                        # overridden by VLLM_BASE_URL (8000 is the API)

retrieval:
  top_k: 5                 # articles sent to the model per question (API, evaluation)
  rerank: false            # distilled re-ranker (rag.rerank): re-order rerank_candidates, keep top_k
  rerank_candidates: 10

rerank:                    # re-ranker distillation (rag.rerank.data, rag.rerank.distill)
  teacher: Qwen/Qwen3-Reranker-4B   # or `llm`: the LLM backend (Qwen2.5-7B on vLLM, or Bedrock) judging yes/no
  student: Qwen/Qwen3-Reranker-0.6B    # the base the student starts from
  model_dir: data/rerank/student       # the distilled student; the pipeline loads it (base student if missing)
  articles: 300            # training articles, sampled from in-force articles not used by the evaluation set
  candidates: 10           # retrieved candidates per question, scored by the teacher
  max_doc_tokens: 384
  epochs: 2
  lr: 1.0e-5
  seed: 13

evaluation:                # RAGAS faithfulness (rag.evaluation): experiments and the CI quality gate
  answer_backend: vllm     # the model under test: the production model
  judge_backend: vllm      # RAGAS judge; bedrock is optional (--judge-backend bedrock)
  concurrency: 8           # parallel answer + judge requests
  gate_min_faithfulness: 0.75   # CI fails below this (handbook R06)
  gate_questions: ci       # questions with "ci": true in eval/questions.jsonl (20)

corpus:
  pdf: data/raw/egyptian_civil_code.pdf
  output: data/processed/articles.json
  report: data/processed/corpus_report.json
  first_article: 1
  last_article: 1149
  repealed: ["54-80", "389-417"]     # expected; the build warns if the PDF says otherwise
  line_merge_pt: 3.5                 # chars within this vertical distance form one visual line
  min_chars: 15                      # shorter live articles are flagged
  max_chars: 6000                    # longer ones are flagged (likely two articles merged)
  ar_en_length_ratio: [0.35, 1.6]    # len(text_ar) / len(text_en) outside this range is flagged
  part_corrections:                  # official structure: fills a part (or part title) the PDF leaves out
                                     # (the PDF prints "SECOND PART / REAL RIGHTS" but no Arabic title)
    - starts_at_book: 3
      number: 2
      title_en: Real Rights
      title_ar: الحقوق العينية
      source: https://qadaya.net/?p=6648

ingest:
  model: Qwen/Qwen3-Embedding-0.6B
  collection: civil_code
  index_dir: data/index/chroma
  report: data/processed/index_report.json
  normalize_arabic: false            # strip tashkeel/tatweel and unify alef variants before embedding
  chunking:                          # article | window | per_language (src/rag/ingest/chunks.py)
    strategy: article                # one bilingual chunk per article
    chunk_size: null                 # window only: max tokens per chunk, heading included
    overlap: 0                       # window only: tokens shared by neighbouring windows
  max_chunk_tokens: 8192             # longer chunks are flagged (the model would truncate them)
  tokens_per_batch: 4096             # padded tokens per GPU batch (length-sorted); fastest measured, see README
  max_replicas: 4                    # upper bound; auto adds replicas only if they fit AND the GPU has idle cores
  vram_margin_gb: 2.0                # free VRAM always left untouched (Windows, vLLM, others)

experiments:                         # python -m rag.experiments.chunking → MLflow (sqlite:///mlflow.db)
  questions: eval/questions.jsonl
  index_dir: data/experiments/chroma # one throwaway index per config; production data/index is untouched
  top_k: 5                           # hit@k / recall@k cut-off; matches retrieval.top_k
  chunking:                          # each entry is one MLflow run (overlap in tokens)
    - {strategy: article, model: Qwen/Qwen3-Embedding-0.6B}
    - {strategy: per_language, model: Qwen/Qwen3-Embedding-0.6B}
    - {strategy: window, chunk_size: 128, overlap: 16, model: Qwen/Qwen3-Embedding-0.6B}
    - {strategy: window, chunk_size: 256, overlap: 32, model: Qwen/Qwen3-Embedding-0.6B}
    - {strategy: window, chunk_size: 512, overlap: 64, model: Qwen/Qwen3-Embedding-0.6B}
    - {strategy: article, model: BAAI/bge-m3}
    - {strategy: per_language, model: BAAI/bge-m3}
    - {strategy: window, chunk_size: 256, overlap: 32, model: BAAI/bge-m3}
