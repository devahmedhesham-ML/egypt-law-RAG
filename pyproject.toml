[project]
name = "egypt-law-rag"
version = "0.1.0"
description = "Arabic/English question answering over the Egyptian Civil Code with article citations"
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
